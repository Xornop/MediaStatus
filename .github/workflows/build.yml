name: Build APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Default: the token can only read. Only the release job below may write.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a full commit SHA (a tag can be moved to other code);
      # Dependabot keeps these up to date (.github/dependabot.yml).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk mediastatus.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mediastatus-apk
          path: mediastatus.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to create the GitHub release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mediastatus-apk
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: mediastatus.apk
