name: Build APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Default: the token can only read. Only the release job below may write.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      # Actions are pinned to a full commit SHA (a tag can be moved to other code);
      # Dependabot keeps these up to date (.github/dependabot.yml).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 2
      # Decide whether this run makes a GitHub release:
      # - a pushed tag like v1.2           -> release with that tag
      # - a push to main that changes versionName in app/build.gradle
      #                                    -> release with tag v<versionName>
      # - anything else                    -> only a build (APK as artifact)
      - id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          version_of() { sed -n "s/^ *versionName *['\"]\([^'\"]*\)['\"].*/\1/p" | head -n1; }
          now=$(version_of < app/build.gradle)
          tag=""
          if [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
          elif [ "$EVENT" = push ] && [ "$REF_NAME" = main ] && [ -n "$now" ]; then
            git fetch --quiet --depth=1 origin "$BEFORE" 2>/dev/null || true
            before=$(git show "$BEFORE:app/build.gradle" 2>/dev/null | version_of || true)
            if [ -n "$before" ] && [ "$before" != "$now" ]; then
              tag="v$now"
            fi
          fi
          echo "versionName=$now release_tag=${tag:-<none>}"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk mediastatus.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mediastatus-apk
          path: mediastatus.apk

  release:
    if: needs.build.outputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to create the GitHub release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mediastatus-apk
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          target_commitish: ${{ github.sha }}  # creates the tag on this commit if it doesn't exist yet
          generate_release_notes: true
          files: mediastatus.apk
